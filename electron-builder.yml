appId: ai.codefly.app
productName: CodeFly AI
copyright: Copyright 2026 CodeFly AI

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/**
  - package.json
  - "!node_modules/**"

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CodeFly AI
  artifactName: CodeFly-AI-Setup-${version}.${ext}

portable:
  artifactName: CodeFly-AI-Portable-${version}.${ext}
